[build]
  publish = "dist"
  command = "pnpm run build"

[build.environment]
  NODE_VERSION = "18"
  PNPM_VERSION = "8"

[[redirects]]
  from = "/sitemap.xml"
  to = "https://ipm-services-kevinajackson21.replit.app/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/properties/:slug"
  to = "https://ipm-services-kevinajackson21.replit.app/properties/:slug"
  status = 200
  force = true

[dev]
  command = "pnpm run dev"
  port = 5173
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

